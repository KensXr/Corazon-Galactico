<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Galaxia Corazón</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; background: #010614; color: #dff1ff; font-family: Georgia, 'Times New Roman', serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #cap { position: fixed; left: 0; right: 0; top: 42%; text-align: center; font-size: clamp(20px, 5vw, 34px); letter-spacing: .12em; text-shadow: 0 0 18px #2f9bff; opacity: 0; transition: opacity 1.2s; pointer-events: none; padding: 0 20px; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 13px; letter-spacing: .1em; opacity: 0; transition: opacity 1.5s; pointer-events: none; }
  #skip { position: fixed; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); background: none; border: 1px solid #4aa3ff88; color: #9fd0ff; border-radius: 20px; padding: 6px 14px; font: 13px Georgia, serif; cursor: pointer; }
  #card { max-height: 72vh; overflow-y: auto; position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px) scale(.95); width: min(86vw, 380px); box-sizing: border-box; padding: 20px 24px; border-radius: 16px; background: rgba(4, 22, 60, .92); border: 1px solid #4aa3ff99; box-shadow: 0 0 40px #1a6cff66; opacity: 0; pointer-events: none; transition: .4s; text-align: center; }
  #card.on { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  #back { display: none; position: fixed; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); background: none; border: 1px solid #4aa3ff88; color: #9fd0ff; border-radius: 20px; padding: 6px 14px; font: 13px Georgia, serif; cursor: pointer; }
  #card h2 { margin: 0 0 8px; font-weight: normal; letter-spacing: .06em; color: #8fd0ff; }
  #card p { margin: 0 0 14px; line-height: 1.5; }
  #card small { opacity: .5; }
  #mhint { position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); max-width: 55vw; font-size: 12px; letter-spacing: .06em; color: #9fd0ff; opacity: 0; transition: opacity 1s; pointer-events: none; }
  #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 24px; text-align: center; cursor: pointer; background: radial-gradient(circle at 50% 45%, #06214d 0%, #010614 70%); transition: opacity .9s; }
  #start.off { opacity: 0; pointer-events: none; }
  #start h1 { margin: 0; font-weight: normal; letter-spacing: .14em; font-size: clamp(24px, 6vw, 40px); text-shadow: 0 0 18px #2f9bff; }
  #start p { margin: 0; font-size: 14px; letter-spacing: .12em; color: #9fd0ff; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  #cm { display: none; gap: 8px; margin: 0 0 14px; overflow-x: auto; scroll-snap-type: x mandatory; }
  #cm img, #cm video { flex: 0 0 100%; width: 100%; max-height: 36vh; object-fit: contain; scroll-snap-align: center; border-radius: 10px; background: #020c22; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><h1>Galaxia Corazón</h1><p>♪ Toca para comenzar</p></div>
<div id="cap"></div>
<div id="hint">Arrastra para girar · toca el planeta que brilla o una estrella · pellizca para acercar</div>
<button id="skip">Saltar</button>
<button id="back">← Alejar</button>
<div id="mhint">♪ Toca la pantalla para activar la música</div>
<div id="card"><h2 id="ct"></h2><div id="cm"></div><p id="cp"></p><small>toca para cerrar</small></div>
<script>
// ====== PERSONALIZA AQUÍ: cada planeta es un punto de interés ======
// Para añadir foto o video a la tarjeta, agrega  media: "fotos/mi-foto.jpg"  (ruta RELATIVA a este index.html)
// o varias:  media: ["fotos/a.jpg", "videos/b.mp4"]  (se deslizan de lado). Formatos: jpg, png, gif, webp, mp4, webm.
const PLANETS = [ // en orden cronológico: el 1 es el más cercano al corazón y el 10 el más lejano
  { name: "Nuestro primer encuentro", text: "Aquí cuenta cómo y dónde se conocieron.", r: 22, size: 2.2, hue: 195, speed: 0.16, ph: 0.0 },
  { name: "Problemas", text: "Aquí escribe las dificultades que enfrentaron y lo que aprendieron.", r: 26, size: 2.6, hue: 210, speed: 0.16, ph: 2.4 },
  { name: "Amor por primera vez", text: "Aquí escribe cuándo sintieron por primera vez que era amor.", r: 30, size: 2.0, hue: 200, speed: 0.16, ph: 4.8 },
  { name: "Nuestras diferencias", text: "Aquí escribe en qué se distinguen y cómo se complementan.", r: 34, size: 2.8, hue: 255, speed: 0.16, ph: 7.2 },
  { name: "Tiempo juntos", text: "Aquí escribe los momentos que más disfrutan compartir.", r: 38, size: 2.3, hue: 190, speed: 0.16, ph: 9.6 },
  { name: "Primer aniversario", text: "Aquí escribe cómo fue celebrar su primer año.", r: 42, size: 3.0, hue: 215, speed: 0.16, ph: 12.0 },
  { name: "Navidad", text: "Aquí escribe el recuerdo de su Navidad juntos.", r: 46, size: 2.1, hue: 170, speed: 0.16, ph: 14.4 },
  { name: "Amor y Amistad", text: "Aquí escribe lo que vivieron en su Amor y Amistad.", r: 50, size: 2.6, hue: 205, speed: 0.16, ph: 16.8 },
  { name: "Más diferencias...", text: "Aquí escribe las nuevas diferencias y cómo las superaron.", r: 54, size: 2.4, hue: 265, speed: 0.16, ph: 19.2 },
  { name: "Nuestro futuro", text: "Aquí escribe todo lo que sueñan construir juntos.", r: 58, size: 3.4, hue: 225, speed: 0.16, ph: 21.6 }
];
// Estrellas con mensaje: se pueden tocar en cualquier momento (no forman parte de la cronología).
// Igual que los planetas, admiten  media: "fotos/mi-foto.jpg"  o una lista de fotos/videos.  Agrega o quita las que quieras.
const MSTARS = [
  { name: "Gracias", text: "Aquí escribe algo por lo que quieras darle las gracias." },
  { name: "Lo que admiro", text: "Aquí escribe lo que más admiras de esta persona." },
  { name: "Un deseo", text: "Aquí escribe un deseo para los dos." },
  { name: "Un secreto", text: "Aquí escribe algo que nunca te has atrevido a decir." },
  { name: "Cuando te extraño", text: "Aquí escribe qué haces o qué piensas cuando la distancia pesa." },
  { name: "Siempre", text: "Aquí escribe tu promesa o tu mensaje final." }
];
const CAPTIONS = [];
const _OLD = ["Recorriendo el universo…", "Entre miles de millones de estrellas…", "Hay una galaxia con un corazón"];
// ====================================================================

// ===== Música: ambiente generada en el navegador (o tu propia canción) =====
let AC, master, bus, timer, off, nextT = 0, barN = 0, on = false, el = null;
const CH = [[57,60,64,67,71],[53,57,60,64,67],[48,52,55,59,64],[55,59,62,66,69]], hz = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0; bus = AC.createGain();
  const len = AC.sampleRate * 3, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5); }
  const rev = AC.createConvolver(), wet = AC.createGain(); rev.buffer = ir; wet.gain.value = .6;
  bus.connect(master); bus.connect(rev); rev.connect(wet); wet.connect(master); master.connect(AC.destination);
}
function tone(f, t, d, v, a) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + .1);
}
function heartBeatTick() {
  if (el || !AC || !on) return; // con canción propia no agregamos sonido extra, para no chocar con ella
  const t = AC.currentTime;
  tone(hz(33), t, .5, .22, .008); tone(hz(45), t, .38, .13, .012); tone(hz(64), t + .07, .3, .05, .02);
}
function bar(t, n) {
  const ch = CH[n % 4];
  ch.forEach((m, i) => { tone(hz(m), t, 9, .045, 3); tone(hz(m) * 1.004, t, 9, .03, 3.5); });
  tone(hz(ch[0] - 12), t, 8.5, .11, .6);
  for (let i = 0; i < 16; i++) if (Math.random() < .62) tone(hz(ch[Math.floor(Math.random() * 5)] + (Math.random() < .5 ? 12 : 24)), t + i * .5, 2.4, .04, .01);
}
function sched() { while (nextT < AC.currentTime + 2) { bar(nextT, barN++); nextT += 8; } }
function startAudio() {
  if (el) { el.play(); return; }
  if (!AC) setupAudio(); clearTimeout(off); AC.resume(); nextT = AC.currentTime + .15; sched(); clearInterval(timer); timer = setInterval(sched, 500);
  master.gain.cancelScheduledValues(AC.currentTime); master.gain.linearRampToValueAtTime(.8, AC.currentTime + 2.5);
}
function stopAudio() {
  if (el) { el.pause(); return; } if (!AC) return;
  master.gain.cancelScheduledValues(AC.currentTime); master.gain.linearRampToValueAtTime(0, AC.currentTime + .6);
  off = setTimeout(() => { clearInterval(timer); AC.suspend(); }, 700);
}
const mh = document.getElementById('mhint'), EVS = ['pointerdown', 'touchend', 'click', 'keydown'];
function tryStart() {
  if (on) return;
  try {
    if (!AC) setupAudio();
    AC.resume().then(() => { if (AC.state === 'running' && !on) { on = true; startAudio(); mh.style.opacity = 0; EVS.forEach(ev => removeEventListener(ev, tryStart, true)); } }).catch(() => {});
  } catch (e) {}
}
EVS.forEach(ev => addEventListener(ev, tryStart, true));
let started = false; const startEl = document.getElementById('start');
function onKey() { begin(); }
function begin() { if (started) return; started = true; tryStart(); t0 = performance.now(); startEl.classList.add('off'); removeEventListener('keydown', onKey); }
startEl.addEventListener('click', begin); addEventListener('keydown', onKey);
document.addEventListener('visibilitychange', () => { if (!on) return; if (document.hidden) { el ? el.pause() : AC.suspend(); } else { el ? el.play() : AC.resume(); } });

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const cap = document.getElementById('cap'), hint = document.getElementById('hint');
let W, H, DPR;
const MOB = matchMedia('(pointer: coarse)').matches || innerWidth < 700;
function resize() { DPR = Math.min(devicePixelRatio || 1, MOB ? 1.5 : 2); W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR; }
addEventListener('resize', resize); resize();

const g3 = () => Math.random() + Math.random() + Math.random() - 1.5;
// Galaxia espiral
const GS = 1.2; // tamaño de la galaxia
const G = [];
for (let i = 0, NG = MOB ? 3800 : 5500; i < NG; i++) {
  const r = Math.pow(Math.random(), .7) * 62 + 4, arm = i % 3, a = arm * 2.094 + r * .09 + g3() * .5 / (1 + r * .02);
  G.push({ x: Math.cos(a) * r + g3() * 2, y: g3() * (1.5 + 6 / (1 + r * .15)), z: Math.sin(a) * r + g3() * 2,
    hue: 235 - Math.min(1, 1 - r / 62 + .2) * 40, l: 55 + (1 - r / 62) * 30, s: Math.random() * 1.5 + .6, tw: Math.random() * 6.28 });
}
// Núcleo brillante extra (más luz en el centro)
for (let i = 0, NB = MOB ? 600 : 1100; i < NB; i++) {
  const r = Math.pow(Math.random(), 1.6) * 15, a = Math.random() * 6.283;
  G.push({ x: Math.cos(a) * r, y: g3() * 3 * (1 - r / 18), z: Math.sin(a) * r, hue: 185 + Math.random() * 20, l: 82 + Math.random() * 15, s: Math.random() * 1.5 + 1, tw: Math.random() * 6.28 });
}
G.forEach(o => { o.x *= GS; o.y *= GS; o.z *= GS; });
MSTARS.forEach((s, i) => { // posición repartida automáticamente: distintos ángulos, radios y alturas
  const a = .6 + i * 2.399, r = (24 + (i * 19) % 40) * GS, sg = i % 2 ? 1 : -1;
  Object.assign(s, { x: Math.cos(a) * r, z: Math.sin(a) * r, y: sg * (9 + (i * 5) % 11) * GS, size: s.size || .9, hue: s.hue || 48, ph: i * 1.7, n: 0, isStar: true, key: 'star:' + s.name });
});
PLANETS.forEach((p, i) => { p.r *= GS; p.size *= GS; p.n = i + 1; p.oy = Math.sin(i * 2.1) * 6 * GS; });
// Corazón (solo contorno, de pie sobre el centro)
const HY = 15 * GS, Hh = [];
for (let i = 0; i < 2200; i++) {
  const t = Math.random() * 6.283, k = 1 + g3() * .035, sc = .6 * GS;
  const hx = 16 * Math.pow(Math.sin(t), 3), hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  Hh.push({ x: hx * k * sc + g3() * .25, y: hy * k * sc + HY + g3() * .25, z: g3() * 1.2,
    hue: 175 + Math.random() * 25, l: 78 + Math.random() * 20, s: Math.random() * 1.6 + .8, tw: Math.random() * 6.28 });
}
// Nebulosas suaves y flores azules a la deriva
const NH = [185, 200, 215, 225, 240, 160, 265, 285, 320, 195]; // celestes, azules, turquesa, violetas y magenta
const NEB = Array.from({ length: MOB ? 15 : 24 }, (_, i) => ({ x: (Math.random() * 2 - 1) * 250, y: (Math.random() * 2 - 1) * 100, z: (Math.random() * 2 - 1) * 250, r: 85 + Math.random() * 95, h: NH[i % NH.length] + Math.random() * 20 - 10, p: i * 1.7 }));
const FL = Array.from({ length: 14 }, () => ({ x: (Math.random() * 2 - 1) * 300, y: (Math.random() * 2 - 1) * 120, z: (Math.random() * 2 - 1) * 300, r: 2.5 + Math.random() * 6, vx: (Math.random() * .5 + .2) * .004, ph: Math.random() * 6.28, rot: Math.random() * 6.28 }));
function flower(x, y, r, rot, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = a;
  for (let i = 0; i < 8; i++) {
    ctx.rotate(.785); const g = ctx.createLinearGradient(0, 0, 0, -r);
    g.addColorStop(0, '#bfe8ff'); g.addColorStop(.5, '#2f8cff'); g.addColorStop(1, '#0a2a9a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -r * .55, r * .24, r * .5, 0, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}
// Lluvia de estrellas: cada tanto, en un lugar distinto del cielo
const M = []; let nextSh = 0, lsx = 9, lsy = 9;
// Flores azules de otro tipo (margarita)
const FY = Array.from({ length: MOB ? 6 : 10 }, () => ({ x: (Math.random() * 2 - 1) * 300, y: (Math.random() * 2 - 1) * 120, z: (Math.random() * 2 - 1) * 300, r: 2.5 + Math.random() * 4.5, vx: (Math.random() * .5 + .2) * .003, ph: Math.random() * 6.28, rot: Math.random() * 6.28 }));
function daisy(x, y, r, rot, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = a;
  for (let i = 0; i < 14; i++) {
    ctx.rotate(6.283 / 14); const g = ctx.createLinearGradient(0, 0, 0, -r);
    g.addColorStop(0, '#0a3fbf'); g.addColorStop(.5, '#2f9bff'); g.addColorStop(1, '#c4f2ff');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -r * .68, r * .11, r * .32, 0, 0, 6.283); ctx.fill();
  }
  const c = ctx.createRadialGradient(0, 0, 0, 0, 0, r * .33); c.addColorStop(0, '#f2fdff'); c.addColorStop(.7, '#7fdcff'); c.addColorStop(1, '#1f7bff');
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 0, r * .33, 0, 6.283); ctx.fill(); ctx.restore();
}
// Estrellas de fondo / warp
const ST = [];
for (let i = 0, NS = MOB ? 1600 : 2600; i < NS; i++) {
  const far = i >= NS * .42, R = far ? 1700 : 340; let x, y, z;
  do { x = (Math.random() * 2 - 1) * R; y = (Math.random() * 2 - 1) * R * (far ? .8 : .6); z = (Math.random() * 2 - 1) * R; } while (!far && Math.hypot(x, y, z) < 95);
  const big = Math.random() < .05;
  ST.push({ x, y, z, R, v: far ? .002 : .01, b: (far ? .8 + Math.random() * 1.2 : .2 + Math.random() * .35) * (big ? 2.2 : 1), big, tw: Math.random() * 6.28 });
}

let rx = .55, ry = 0, vx = 0, vy = .003, zoom = 1, drag = false, lx = 0, ly = 0, sx0 = 0, sy0 = 0, pinch = 0, skipped = false;
const ptr = new Map(), seen = new Set();
const card = document.getElementById('card');
cv.addEventListener('pointerdown', e => { ptr.set(e.pointerId, e); drag = true; lx = sx0 = e.clientX; ly = sy0 = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  ptr.set(e.pointerId, e);
  if (ptr.size === 2) { const [a, b] = [...ptr.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (pinch) zoom = Math.min(2.6, Math.max(.5, zoom * d / pinch)); pinch = d; return; }
  if (!drag) return;
  vy = (e.clientX - lx) * .006; vx = (e.clientY - ly) * .004;
  ry += vy; rx = Math.min(1.5, Math.max(-.2, rx + vx)); lx = e.clientX; ly = e.clientY;
});
cv.addEventListener('pointerup', e => {
  ptr.delete(e.pointerId); pinch = 0; if (!ptr.size) drag = false;
  if (Math.hypot(e.clientX - sx0, e.clientY - sy0) < 8) hit(e.clientX * DPR, e.clientY * DPR);
});
cv.addEventListener('pointercancel', e => { ptr.delete(e.pointerId); pinch = 0; drag = false; });
cv.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.min(2.6, Math.max(.5, zoom * (e.deltaY < 0 ? 1.08 : .92))); }, { passive: false });
card.addEventListener('click', () => { if (foc) unfocus(); else closeCard(); }); // con un planeta enfocado, cerrar la tarjeta también aleja la cámara
document.getElementById('cm').addEventListener('click', e => e.stopPropagation());
document.getElementById('skip').addEventListener('click', () => { skipped = true; t0 = performance.now() - INTRO * 1000; document.getElementById('skip').style.display = 'none'; });

// ===== Foto / video en la tarjeta =====
function duck(d) { try { if (el) el.volume = d ? .15 : 1; else if (AC && master) { master.gain.cancelScheduledValues(AC.currentTime); master.gain.linearRampToValueAtTime(d ? .12 : .8, AC.currentTime + .6); } } catch (e) {} }
function stopMedia() { document.querySelectorAll('#cm video').forEach(v => v.pause()); }
function setMedia(list) {
  const cm = document.getElementById('cm'); cm.innerHTML = '';
  [].concat(list || []).filter(Boolean).forEach(src => {
    const isV = /\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(src), n = document.createElement(isV ? 'video' : 'img'); n.src = src;
    if (isV) { n.controls = true; n.playsInline = true; n.preload = 'metadata'; n.addEventListener('play', () => duck(true)); n.addEventListener('pause', () => duck(false)); n.addEventListener('ended', () => duck(false)); }
    n.addEventListener('error', () => { n.remove(); if (!cm.children.length) cm.style.display = 'none'; });
    cm.appendChild(n);
  });
  cm.style.display = cm.children.length ? 'flex' : 'none';
}

// ===== Acercamiento a un planeta =====
let pt = 0, heartPhase = 0, cam0 = 100, foc = null, from = [0, 0, 0], fpos = [0, 0, 0], sw = 1, fzL = 0, nearD = 14, lastNow = 0, cardTimer = 0, heartX = 0, heartY = 0, heartK = 0, doneT = 0;
const HEART = { isHeart: true }; // objeto especial: se activa cuando ya se tocaron todos los planetas y estrellas
const HEART_ZOOM = 33;
const FINAL_BPM = 70; // pulso del corazón al final, en beats por minuto, cuando usas la música ambiente generada
const SONG_BPM = null; // si cargas tu propia canción y quieres que el latido vaya a SU ritmo, pon aquí su BPM (ej. 120). El primer beat de tu canción debe caer justo al iniciarla (segundo 0). // qué tan cerca queda la cámara del corazón al entrar (menor = más cerca)
let collapsing = false, collapseStart = 0; // colapso final: al tocar el corazón, todo el universo se comprime hacia él
const COLLAPSE_DUR = 6200; // duración del colapso final en ms
const back = document.getElementById('back');
const TAPPABLE = PLANETS.concat(MSTARS); // todo lo que responde al toque
let unlocked = 1; // cronología: cuántos planetas están desbloqueados (1 = solo el primero)
PLANETS.forEach(p => p.la = p.n <= unlocked ? 1 : 0); // p.la: 0 = bloqueado, 1 = desbloqueado (se anima)
const DISK_W = .16 * .6; // velocidad de giro del disco completo (galaxia + corazón + planetas)
const ppos = (p, now) => { const a = pt / 1000 * DISK_W + p.ph; return [Math.cos(a) * p.r, p.oy, Math.sin(a) * p.r]; };
const oval = (p, a) => [Math.cos(a) * p.r, p.oy, Math.sin(a) * p.r];
const spin = (x, z, ang) => { const c = Math.cos(ang), s2 = Math.sin(ang); return [x * c + z * s2, -x * s2 + z * c]; };
function focusOn(p) {
  from = fpos.slice(); sw = 0; foc = p; curStar = null; seen.add(p.name);
  if (p.n === unlocked && unlocked < PLANETS.length) unlocked++;
  document.getElementById('ct').textContent = p.n + ' · ' + p.name; document.getElementById('cp').textContent = p.text; setMedia(p.media);
  card.classList.remove('on'); clearTimeout(cardTimer); cardTimer = setTimeout(() => card.classList.add('on'), 1100);
  back.style.display = 'block'; hint.style.opacity = 0;
}
function unfocus() {
  if (!foc) return;
  from = fpos.slice(); sw = 0; foc = null; clearTimeout(cardTimer);
  card.classList.remove('on'); stopMedia(); back.style.display = 'none'; hint.style.opacity = .7;
}
back.addEventListener('click', unfocus);
function triggerCollapse() {
